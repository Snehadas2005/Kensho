[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kensho"
description = "Autonomous open-source PR triage and bug reproduction agent"
requires-python = ">=3.11"
dynamic = ["version", "dependencies"]

[project.scripts]
kensho = "main:app"
git-kensho = "main:app"   # lets you type: git kensho issue 13401

[tool.setuptools]
py-modules = ["main"]
packages = ["core"]

[tool.setuptools.dynamic]
version = { attr = "core.__version__" }
dependencies = { file = ["requirements.txt"] }
